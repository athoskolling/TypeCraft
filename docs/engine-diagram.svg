<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 220" width="1120" height="220" role="img" aria-label="TypeCraft 3-Layer Diagnostic Engine Architecture">
  <rect x="0.5" y="0.5" width="1119" height="219" rx="14" fill="#fdfdfe" stroke="#e2e5ec" />

  <!-- Layer 1 -->
  <g transform="translate(24, 24)">
    <rect x="0" y="0" width="332" height="172" rx="10" fill="#f5f7fa" stroke="#e2e5ec" />
    <rect x="18" y="18" width="76" height="22" rx="5" fill="#537fc4" fill-opacity="0.14" />
    <text x="56" y="33" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#537fc4">LAYER 01</text>
    <text x="18" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#121317">Strict Compiler &amp; AST</text>
    <text x="18" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#686b73">src/engine/layer1Compiler.ts</text>
    <text x="18" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#45474d">• ts.createProgram (strict: true)</text>
    <text x="18" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#45474d">• Expect&lt;Equal&lt;...&gt;&gt; type assertions</text>
    <text x="18" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#45474d">• Blocks any / @ts-ignore + friendly TS errors</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M366 110H384M379 104L385 110L379 116" stroke="#537fc4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Layer 2 -->
  <g transform="translate(394, 24)">
    <rect x="0" y="0" width="332" height="172" rx="10" fill="#f5f7fa" stroke="#e2e5ec" />
    <rect x="18" y="18" width="76" height="22" rx="5" fill="#537fc4" fill-opacity="0.14" />
    <text x="56" y="33" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#537fc4">LAYER 02</text>
    <text x="18" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#121317">Sandbox Web Worker</text>
    <text x="18" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#686b73">src/engine/layer2Runner.ts</text>
    <text x="18" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#45474d">• Virtual CommonJS 4-file bundler</text>
    <text x="18" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#45474d">• 4.5s infinite-loop worker respawn</text>
    <text x="18" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#45474d">• console.log capture &amp; immutability checks</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M736 110H754M749 104L755 110L749 116" stroke="#537fc4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Layer 3 -->
  <g transform="translate(764, 24)">
    <rect x="0" y="0" width="332" height="172" rx="10" fill="#121317" stroke="#45474d" />
    <rect x="18" y="18" width="76" height="22" rx="5" fill="#537fc4" fill-opacity="0.25" />
    <text x="56" y="33" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#7aa4e6">LAYER 03</text>
    <text x="18" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fdfdfe">Smart Logic Analyzer</text>
    <text x="18" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#9ea3b0">src/engine/layer3LogicAnalyzer.ts</text>
    <text x="18" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#d0d4de">• Missing return &amp; input mutation</text>
    <text x="18" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#d0d4de">• Off-by-one (±1) &amp; wrong element order</text>
    <text x="18" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#d0d4de">• .toFixed() precision &amp; Beecrowd whitespace</text>
  </g>
</svg>
